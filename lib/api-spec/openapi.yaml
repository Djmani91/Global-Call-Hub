openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: twilio
    description: Read-only Twilio phone number inventory
paths:
  /twilio/pricing:
    get:
      operationId: getTwilioPricing
      tags: [twilio]
      summary: Read marked-up country prices in the customer's billing currency
      parameters:
        - name: countryCode
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TwilioCountryCode"
        - name: billingCountry
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TwilioCountryCode"
      responses:
        "200":
          description: Independent pricing sections; unavailable sections contain a clear error and no rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryPricing"
        "400":
          description: Invalid country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /twilio/available-numbers:
    get:
      operationId: getTwilioAvailableNumbers
      tags: [twilio]
      summary: Search live available phone numbers
      description: Searches Twilio inventory for a supported country. This endpoint never purchases a number.
      parameters:
        - name: countryCode
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TwilioCountryCode"
        - name: phoneNumberType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TwilioPhoneNumberType"
        - name: search
          in: query
          required: false
          description: Digits to match; a three-digit US or Canada area code uses Twilio's area-code filter.
          schema:
            type: string
            minLength: 2
            maxLength: 16
            pattern: "^[0-9]{2,16}$"
      responses:
        "200":
          description: Live available phone numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwilioAvailableNumbersResponse"
        "400":
          description: Unsupported country or number type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Twilio key is missing search permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Twilio credentials or service are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    CountryPricing:
      type: object
      required: [countryCode, billingCountry, currency, multiplier, fetchedAt, sections]
      properties:
        countryCode:
          $ref: "#/components/schemas/TwilioCountryCode"
        billingCountry:
          $ref: "#/components/schemas/TwilioCountryCode"
        currency:
          type: string
        multiplier:
          type: number
        fetchedAt:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/PricingSection"
    PricingSection:
      type: object
      required: [kind, error, sourceCurrency, exchangeRate, exchangeDate, rates]
      properties:
        kind:
          type: string
          enum: [numbers, voice, sms]
        error:
          type: [string, "null"]
        sourceCurrency:
          type: [string, "null"]
        exchangeRate:
          type: [number, "null"]
        exchangeDate:
          type: [string, "null"]
        rates:
          type: array
          items:
            $ref: "#/components/schemas/CustomerRate"
    CustomerRate:
      type: object
      required: [label, direction, numberType, amount, unit, prefixes]
      properties:
        label:
          type: string
        direction:
          type: string
          enum: [rental, incoming, outgoing]
        numberType:
          type: string
        amount:
          type: number
        unit:
          type: string
          enum: [month, minute, segment]
        prefixes:
          type: array
          items:
            type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TwilioCountryCode:
      type: string
      enum: [GB, AU, AT, CA, FI, FR, IL, MX, PR, US]
    TwilioPhoneNumberType:
      type: string
      enum: [local, mobile, toll-free]
    TwilioAvailablePhoneNumber:
      type: object
      properties:
        phoneNumber:
          type: string
        friendlyName:
          type: string
        locality:
          type: [string, "null"]
        region:
          type: [string, "null"]
        capabilities:
          type: object
          properties:
            voice:
              type: boolean
            sms:
              type: boolean
            mms:
              type: boolean
          required: [voice, sms, mms]
      required: [phoneNumber, friendlyName, capabilities]
    TwilioAvailableNumbersResponse:
      type: object
      properties:
        countryCode:
          $ref: "#/components/schemas/TwilioCountryCode"
        phoneNumberType:
          $ref: "#/components/schemas/TwilioPhoneNumberType"
        fetchedAt:
          type: string
          format: date-time
        numbers:
          type: array
          items:
            $ref: "#/components/schemas/TwilioAvailablePhoneNumber"
      required: [countryCode, phoneNumberType, fetchedAt, numbers]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

