openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: customer-auth
    description: Phone-first customer signup and session handoff
  - name: admin
    description: Owner-only customer verification directory
  - name: twilio
    description: Read-only Twilio phone number inventory
paths:
  /auth/readiness:
    get:
      operationId: getCustomerAuthReadiness
      tags: [customer-auth]
      summary: Check whether Twilio phone verification is configured
      responses:
        "200":
          description: Safe public readiness status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthReadiness"
  /auth/phone/start:
    post:
      operationId: startCustomerPhoneVerification
      tags: [customer-auth]
      summary: Send a Twilio verification code to a phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPhoneVerificationRequest"
      responses:
        "200":
          description: Verification started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartPhoneVerificationResponse"
        "400":
          description: Invalid phone number
        "429":
          description: Verification send limit reached
        "503":
          description: Twilio Verify is not configured or unavailable
  /auth/phone/check:
    post:
      operationId: checkCustomerPhoneVerification
      tags: [customer-auth]
      summary: Verify a Twilio code and return a one-time next step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckPhoneVerificationRequest"
      responses:
        "200":
          description: Phone verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckPhoneVerificationResponse"
        "400":
          description: Code is invalid, expired or already used
        "429":
          description: Verification attempt limit reached
        "503":
          description: Twilio Verify or Clerk is unavailable
  /auth/complete:
    post:
      operationId: completeCustomerRegistration
      tags: [customer-auth]
      security: [{customerSession: []}]
      summary: Attach verified phone proof to the verified Clerk account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteCustomerRegistrationRequest"
      responses:
        "200":
          description: Customer account linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "401":
          description: Sign-in required
        "409":
          description: Phone or account is already linked
        "503":
          description: Customer profile could not be saved
  /auth/me:
    get:
      operationId: getCustomerAuthMe
      tags: [customer-auth]
      security: [{customerSession: []}]
      summary: Read the current customer profile and admin status
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthMe"
        "401":
          description: Sign-in required
        "503":
          description: Customer account could not be loaded
  /admin/customers:
    get:
      operationId: getAdminCustomers
      tags: [admin]
      security: [{customerSession: []}]
      summary: List customers and their verification status for the owner
      responses:
        "200":
          description: Customer directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomerDirectory"
        "401":
          description: Sign-in required
        "403":
          description: Owner access required
        "503":
          description: Customer directory could not be loaded
  /billing/readiness:
    get:
      operationId: getBillingReadiness
      tags: [billing]
      responses:
        "200":
          description: Safe public billing configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingReadiness"
  /billing/wallet:
    get:
      operationId: getCreditWallet
      tags: [billing]
      security: [{customerSession: []}]
      responses:
        "200":
          description: Authenticated customer's fixed-currency wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditWallet"
        "401":
          description: Sign-in required
        "503":
          description: Wallet unavailable
  /billing/reconcile:
    post:
      operationId: reconcileCreditWallet
      tags: [billing]
      security: [{customerSession: []}]
      description: Reads provider-verified purchases for the session customer. No client purchase IDs, amounts or identities accepted.
      responses:
        "200":
          description: Reconciled wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditWallet"
        "400":
          description: No input accepted
        "401":
          description: Sign-in required
        "503":
          description: Provider verification unavailable
  /billing/webhook:
    post:
      operationId: handleCreditWebhook
      tags: [billing]
      description: RevenueCat authorization header required. Event data never grants credit; it triggers an authoritative server reconciliation.
      security: [{revenueCatWebhook: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditWebhookInput"
      responses:
        "204":
          description: Processed or irrelevant event
        "400":
          description: Invalid event
        "403":
          description: Invalid authorization
        "503":
          description: Verification unavailable; retry required
  /voice/readiness:
    get:
      operationId: getVoiceReadiness
      tags: [twilio]
      summary: Explain why mobile calling is disabled
      responses:
        "200":
          description: Public readiness information, without customer or account data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceReadiness"
  /voice/token:
    post:
      operationId: createVoiceToken
      tags: [twilio]
      summary: Reserved authenticated mobile token endpoint; issuance is locked
      description: No live tokens are issued in this preparation release. Identity and caller ID can never be supplied by the client.
      security:
        - customerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceTokenInput"
      responses:
        "400":
          description: Invalid platform or client-supplied identity/caller ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Valid customer session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Calling intentionally disabled; no token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /voice/webhooks/{direction}:
    post:
      operationId: handleVoiceWebhook
      tags: [twilio]
      summary: Verify Twilio signature and reject calls while calling is disabled
      description: Form-encoded POST only. Requires the configured canonical HTTPS URL and account Auth Token. Never returns Dial in this release.
      parameters:
        - name: direction
          in: path
          required: true
          schema:
            type: string
            enum: [incoming, outgoing]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/VoiceWebhookInput"
      responses:
        "200":
          description: Signed request for configured account rejected with TwiML; no call leg created
          content:
            application/xml:
              schema:
                type: string
        "400":
          description: Invalid callback
        "403":
          description: Missing or invalid signature or wrong account
        "415":
          description: Only form-encoded callbacks accepted
        "503":
          description: Webhook verification is not configured
  /twilio/pricing:
    get:
      operationId: getTwilioPricing
      tags: [twilio]
      summary: Read marked-up country prices in the customer's billing currency
      parameters:
        - name: countryCode
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TwilioCountryCode"
        - name: billingCountry
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/BillingCountryCode"
      responses:
        "200":
          description: Independent pricing sections; unavailable sections contain a clear error and no rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryPricing"
        "400":
          description: Invalid country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /twilio/available-numbers:
    get:
      operationId: getTwilioAvailableNumbers
      tags: [twilio]
      summary: Search live available phone numbers
      description: Searches Twilio inventory for an account-supported country and type, returning only numbers Twilio marks SMS-enabled. Capabilities are returned per number. This endpoint never purchases a number.
      parameters:
        - name: countryCode
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TwilioCountryCode"
        - name: phoneNumberType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TwilioPhoneNumberType"
        - name: search
          in: query
          required: false
          description: Digits to match; a three-digit US or Canada area code uses Twilio's area-code filter.
          schema:
            type: string
            minLength: 2
            maxLength: 16
            pattern: "^[0-9]{2,16}$"
      responses:
        "200":
          description: Live available SMS-capable phone numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwilioAvailableNumbersResponse"
        "400":
          description: Unsupported country or number type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Twilio key is missing search permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Twilio credentials or service are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /twilio/available-number-countries:
    get:
      operationId: getTwilioAvailableNumberCountries
      tags: [twilio]
      summary: List countries where this Twilio account offers numbers
      description: Returns available countries and number types from Twilio. SMS and voice capabilities are still confirmed on individual numbers.
      responses:
        "200":
          description: Account-specific supported country catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwilioAvailableNumberCountriesResponse"
        "503":
          description: Twilio country catalog unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    revenueCatWebhook:
      type: apiKey
      in: header
      name: Authorization
    customerSession:
      type: http
      scheme: bearer
      bearerFormat: Clerk session JWT
  schemas:
    CustomerAuthReadiness:
      type: object
      required: [phoneVerificationEnabled, message]
      properties:
        phoneVerificationEnabled: {type: boolean}
        message: {type: string}
    StartPhoneVerificationRequest:
      type: object
      additionalProperties: false
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"
    StartPhoneVerificationResponse:
      type: object
      required: [challengeId, expiresAt]
      properties:
        challengeId: {type: string, minLength: 32}
        expiresAt: {type: string, format: date-time}
    CheckPhoneVerificationRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: {type: string, minLength: 32, maxLength: 100}
        code: {type: string, minLength: 4, maxLength: 10, pattern: "^[0-9]+$"}
    CheckPhoneVerificationResponse:
      type: object
      required: [status, registrationToken, signInToken]
      properties:
        status:
          type: string
          enum: [registration_required, signed_in]
        registrationToken: {type: [string, "null"]}
        signInToken: {type: [string, "null"]}
    CompleteCustomerRegistrationRequest:
      type: object
      additionalProperties: false
      properties:
        registrationToken: {type: string, minLength: 32, maxLength: 100}
    CustomerProfile:
      type: object
      required: [clerkUserId, phoneNumber, email, firstName, lastName, phoneVerifiedAt, emailVerifiedAt, createdAt]
      properties:
        clerkUserId: {type: string}
        phoneNumber: {type: [string, "null"]}
        email: {type: string}
        firstName: {type: string}
        lastName: {type: [string, "null"]}
        phoneVerifiedAt: {type: [string, "null"], format: date-time}
        emailVerifiedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    CustomerAuthMe:
      type: object
      required: [customer, isAdmin]
      properties:
        customer:
          oneOf:
            - $ref: "#/components/schemas/CustomerProfile"
            - type: "null"
        isAdmin: {type: boolean}
    AdminCustomerDirectory:
      type: object
      required: [customers]
      properties:
        customers:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CustomerProfile"
              - type: object
                required: [phoneVerified, emailVerified]
                properties:
                  phoneVerified: {type: boolean}
                  emailVerified: {type: boolean}
    BillingReadiness:
      type: object
      required: [productionEnabled, testEnabled, currency, message]
      properties:
        productionEnabled: {type: boolean}
        testEnabled: {type: boolean}
        currency: {type: string, enum: [GBP]}
        message: {type: string}
    CreditWallet:
      type: object
      required: [customerId, currency, balanceMinor, testBalanceMinor, transactions]
      properties:
        customerId: {type: string}
        currency: {type: string, enum: [GBP]}
        balanceMinor: {type: integer}
        testBalanceMinor: {type: integer}
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/CreditTransaction"
    CreditTransaction:
      type: object
      required: [id, amountMinor, environment, kind, createdAt]
      properties:
        id: {type: string}
        amountMinor: {type: integer}
        environment: {type: string, enum: [production, sandbox]}
        kind: {type: string, enum: [purchase, refund]}
        createdAt: {type: string}
    CreditWebhookInput:
      type: object
      required: [event]
      properties:
        event:
          type: object
          required: [id, type]
          properties:
            id: {type: string, minLength: 1, maxLength: 255}
            type: {type: string}
            app_user_id: {type: string, maxLength: 255}
            app_id: {type: string}
            environment: {type: string, enum: [SANDBOX, PRODUCTION]}
    VoiceReadiness:
      type: object
      required: [enabled, expoGoSupported, message, blockers]
      properties:
        enabled:
          type: boolean
          enum: [false]
        expoGoSupported:
          type: boolean
          enum: [false]
        message:
          type: string
        blockers:
          type: array
          items:
            type: string
    VoiceTokenInput:
      type: object
      additionalProperties: false
      required: [platform]
      properties:
        platform:
          type: string
          enum: [ios, android]
    VoiceWebhookInput:
      type: object
      additionalProperties:
        type: string
      required: [AccountSid, CallSid, From, To]
      properties:
        AccountSid:
          type: string
        CallSid:
          type: string
        From:
          type: string
        To:
          type: string
    CountryPricing:
      type: object
      required: [countryCode, billingCountry, currency, multiplier, fetchedAt, sections]
      properties:
        countryCode:
          $ref: "#/components/schemas/TwilioCountryCode"
        billingCountry:
          $ref: "#/components/schemas/BillingCountryCode"
        currency:
          type: string
        multiplier:
          type: number
        fetchedAt:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/PricingSection"
    PricingSection:
      type: object
      required: [kind, error, sourceCurrency, exchangeRate, exchangeDate, rates]
      properties:
        kind:
          type: string
          enum: [numbers, voice, sms]
        error:
          type: [string, "null"]
        sourceCurrency:
          type: [string, "null"]
        exchangeRate:
          type: [number, "null"]
        exchangeDate:
          type: [string, "null"]
        rates:
          type: array
          items:
            $ref: "#/components/schemas/CustomerRate"
    CustomerRate:
      type: object
      required: [label, direction, numberType, amount, unit, prefixes]
      properties:
        label:
          type: string
        direction:
          type: string
          enum: [rental, incoming, outgoing]
        numberType:
          type: string
        amount:
          type: number
        unit:
          type: string
          enum: [month, minute, segment]
        prefixes:
          type: array
          items:
            type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TwilioCountryCode:
      type: string
      pattern: "^[A-Z]{2}$"
    BillingCountryCode:
      type: string
      enum: [GB, AU, AT, CA, FI, FR, IL, MX, PR, US]
    TwilioPhoneNumberType:
      type: string
      enum: [local, mobile, toll-free]
    TwilioAvailableNumberCountry:
      type: object
      properties:
        countryCode:
          $ref: "#/components/schemas/TwilioCountryCode"
        name:
          type: string
        numberTypes:
          type: array
          items:
            $ref: "#/components/schemas/TwilioPhoneNumberType"
      required: [countryCode, name, numberTypes]
    TwilioAvailableNumberCountriesResponse:
      type: object
      properties:
        fetchedAt:
          type: string
          format: date-time
        countries:
          type: array
          items:
            $ref: "#/components/schemas/TwilioAvailableNumberCountry"
      required: [fetchedAt, countries]
    TwilioAvailablePhoneNumber:
      type: object
      properties:
        phoneNumber:
          type: string
        friendlyName:
          type: string
        locality:
          type: [string, "null"]
        region:
          type: [string, "null"]
        capabilities:
          type: object
          properties:
            voice:
              type: boolean
            sms:
              type: boolean
            mms:
              type: boolean
          required: [voice, sms, mms]
      required: [phoneNumber, friendlyName, capabilities]
    TwilioAvailableNumbersResponse:
      type: object
      properties:
        countryCode:
          $ref: "#/components/schemas/TwilioCountryCode"
        phoneNumberType:
          $ref: "#/components/schemas/TwilioPhoneNumberType"
        fetchedAt:
          type: string
          format: date-time
        numbers:
          type: array
          items:
            $ref: "#/components/schemas/TwilioAvailablePhoneNumber"
      required: [countryCode, phoneNumberType, fetchedAt, numbers]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

